<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <text x="20" y="28" font-size="17" font-weight="bold" fill="#0f172a">FlowBoard — layered / ports-and-adapters architecture (COE 692)</text>
  <text x="20" y="48" font-size="12" fill="#64748b">Dependencies point inward. Only the composition root (config.js) knows the concrete adapters.</text>

  <!-- HTTP layer -->
  <rect x="60" y="70" width="740" height="66" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="75" y="92" font-size="13" font-weight="bold" fill="#1e40af">HTTP layer  (web adapter)</text>
  <text x="75" y="113" font-size="11.5" fill="#334155">routes: /boards /cards /activity   ·   middleware: logging → json → error-handler</text>
  <text x="75" y="129" font-size="11" fill="#64748b">thin: parse request, call a service, shape response — no business logic</text>

  <!-- Application layer -->
  <rect x="60" y="150" width="740" height="78" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="75" y="172" font-size="13" font-weight="bold" fill="#5b21b6">Application layer  (use cases)</text>
  <text x="75" y="193" font-size="11.5" fill="#334155">BoardService · CardService   ·   EventBus (Observer)   ·   ordering (Strategy)</text>
  <text x="75" y="210" font-size="11.5" fill="#334155">observers: ActivityLog, Notifier   —   depend on PORTS, not concretes</text>

  <!-- Domain layer -->
  <rect x="60" y="242" width="360" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="75" y="264" font-size="13" font-weight="bold" fill="#065f46">Domain  (pure, no dependencies)</text>
  <text x="75" y="285" font-size="11.5" fill="#334155">Board · Column · Card · domain events</text>
  <text x="75" y="302" font-size="11" fill="#64748b">enforces its own invariants; knows nothing of HTTP/DB</text>

  <!-- Ports -->
  <rect x="440" y="242" width="360" height="72" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="455" y="264" font-size="13" font-weight="bold" fill="#92400e">Ports  (contracts)</text>
  <text x="455" y="285" font-size="11.5" fill="#334155">BoardRepository   ·   NotificationChannel</text>
  <text x="455" y="302" font-size="11" fill="#64748b">the seam where the outside world plugs in</text>

  <!-- Adapters -->
  <rect x="60" y="340" width="740" height="76" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="75" y="362" font-size="13" font-weight="bold" fill="#991b1b">Adapters  (plug into the ports)</text>
  <text x="75" y="383" font-size="11.5" fill="#334155">persistence:  InMemory  |  JSON-file   ( PERSISTENCE=memory|file )</text>
  <text x="75" y="400" font-size="11.5" fill="#334155">notifications:  Console  |  Webhook</text>

  <!-- arrows inward -->
  <line x1="430" y1="136" x2="430" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="430" y1="228" x2="430" y2="242" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="620" y1="340" x2="620" y2="316" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="636" y="332" font-size="10.5" fill="#64748b">implements</text>
  <text x="446" y="148" font-size="10.5" fill="#64748b">depends on ↓</text>

  <text x="20" y="446" font-size="11" fill="#334155">Styles in play:  Layered/Hexagonal (the rings)  ·  Event-driven (EventBus → observers)  ·  Plugin (ports → swappable adapters)</text>
</svg>
